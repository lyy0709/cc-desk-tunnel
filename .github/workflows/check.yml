# The checks a change has to pass, the same ones run by hand before a commit. The interface tests and the
# Windows packaging are not here yet: they need a Windows machine with the bundled components.
name: check
on:
  pull_request:
  push:
    branches: [main, 'dev/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/project-files/go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The CLI terminal-window test uses xterm under xvfb; shell tests use zsh.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh xterm xvfb
      - run: go test ./...
        working-directory: packages/project-files
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run format:check
      - run: xvfb-run -a npm test
      - run: bash deploy/test-scripts.sh
      - run: docker pull node:24-bookworm && bash deploy/test-hardware.sh
  # The service as it is deployed: the image built on the machine, then every way of setting it up, on both
  # architectures a server may have. On arm64 the service's own tests run as well, for what it compiles there.
  deploy:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f deploy/docker/Dockerfile -t cc-desk-tunnel:local .
      - run: sudo bash deploy/test.sh
      - run: sudo bash deploy/test-image.sh
      - if: matrix.runner == 'ubuntu-24.04-arm'
        uses: actions/setup-go@v7
        with:
          go-version-file: packages/project-files/go.mod
          cache: false
      - if: matrix.runner == 'ubuntu-24.04-arm'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: matrix.runner == 'ubuntu-24.04-arm'
        run: sudo apt-get install -y --no-install-recommends zsh && npm ci && npm test
  # A Docker without buildx builds with the older builder, which gives the directories it makes to root whoever
  # the build runs as. The image is built that way too, so that it goes on working where BuildKit is missing.
  deploy-legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f deploy/docker/Dockerfile -t cc-desk-tunnel:local .
        env:
          DOCKER_BUILDKIT: '0'
      - run: sudo bash deploy/test.sh
  # Windows-specific project access and command lifecycle tests.
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/project-files/go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: go test ./...
        working-directory: packages/project-files
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  # Exercise the macOS client and its local project tools.
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/project-files/go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: go test ./...
        working-directory: packages/project-files
      - run: npm ci
      - run: npm test
